spring:
  datasource:
    url: jdbc:mysql://localhost:3306/daocheng_dp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root        # 替换为实际用户名
    password: qwe123      # 替换为实际密码
    driver-class-name: com.mysql.cj.jdbc.Driver

file:
  upload-path: F:/uploads

  jpa:
    hibernate:
      ddl-auto: update     # 开发时使用 update 自动建表，生产环境建议 validate 或 none
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
          static-locations: file:${file.upload-path}, classpath:/static

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.daocheng.api.user.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: your-secret-key-for-jwt-must-be-at-least-256-bits-long
  expiration: 604800000   # 7天（毫秒）

