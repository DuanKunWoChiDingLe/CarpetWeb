# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

databases:
  - name: carpetweb-postgres
    plan: free
    region: singapore

services:
  - type: web
    name: carpetweb-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/banners
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: carpetweb-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: carpetweb-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: carpetweb-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: carpetweb-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: carpetweb-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 604800000
      - key: ORDER_PAY_PASSWORD
        sync: false # Enter a 6-digit payment password when creating the Blueprint
      - key: FILE_UPLOAD_PATH
        value: /tmp/uploads
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.onrender.com
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70

  - type: web
    name: carpetweb-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build-only
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: carpetweb-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
