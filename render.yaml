# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  # MySQL is not offered as a managed Render database, so it runs as a private
  # Docker service with a persistent disk and the bundled initial schema.
  - type: pserv
    name: carpetweb-mysql
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./deploy/mysql/Dockerfile
    dockerContext: .
    envVars:
      - key: MYSQL_DATABASE
        value: daocheng_dp
      - key: MYSQL_USER
        value: carpetweb
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: carpetweb-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  - type: web
    name: carpetweb-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    rootDir: 后端
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/banners
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: carpetweb-mysql
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: carpetweb-mysql
          property: port
      - key: DB_NAME
        value: daocheng_dp
      - key: DB_USERNAME
        value: carpetweb
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: carpetweb-mysql
          envVarKey: MYSQL_PASSWORD
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 604800000
      - key: ORDER_PAY_PASSWORD
        sync: false # Enter a 6-digit payment password when creating the Blueprint
      - key: FILE_UPLOAD_PATH
        value: /var/data/uploads
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://*.onrender.com
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75
    disk:
      name: carpetweb-uploads
      mountPath: /var/data
      sizeGB: 5

  - type: web
    name: carpetweb-web
    runtime: static
    rootDir: 前端
    buildCommand: npm ci && npm run build-only
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      # Render exposes this value from the API service to the static site build.
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: carpetweb-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin




